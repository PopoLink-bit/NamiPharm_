<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nami Pharm Supplements</title>
    <meta name="description" content="Premium Landing Page with interactive Neuro-Synaptic DNA Matrix Decoder (N.S.D.M.D) for personalized supplements." />
    <meta property="og:title" content="Nami Pharm Supplements" />
    <meta property="og:description" content="Premium Landing Page with interactive Neuro-Synaptic DNA Matrix Decoder (N.S.D.M.D) for personalized supplements." />
    <!-- Resource Hints & Font Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
    <link rel="preload" as="image" href="https://i.postimg.cc/Vsb5FX7n/logo.png" fetchpriority="high" />
    <!-- High Performance Google Fonts Loading -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050505; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #ffffff; z-index: 99999; padding: 20px; text-align: center;">
        <!-- Outer Glow Ambient Light -->
        <div style="position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(0,0,0,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;"></div>
        
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; max-width: 400px; width: 100%;">
          <!-- Logo Container with elegant pulse -->
          <div style="margin-bottom: 30px; animation: pulseLogo 3s ease-in-out infinite;">
            <img src="https://i.postimg.cc/Vsb5FX7n/logo.png" alt="NAMI PHARM" style="height: 120px; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));" />
          </div>

          <!-- Animated Premium Loader Rings -->
          <div style="position: relative; width: 64px; height: 64px; margin-bottom: 24px;">
            <div style="position: absolute; inset: 0; border: 2px dashed rgba(245, 158, 11, 0.15); border-radius: 50%; animation: spinClockwise 8s linear infinite;"></div>
            <div style="position: absolute; inset: 4px; border: 2px solid transparent; border-top-color: #f59e0b; border-bottom-color: #d97706; border-radius: 50%; animation: spinClockwise 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite; filter: drop-shadow(0 0 8px rgba(245,158,11,0.5));"></div>
            <div style="position: absolute; inset: 12px; border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 50%; animation: spinCounterClockwise 4s linear infinite;"></div>
          </div>

          <!-- Brand and Text -->
          <div style="letter-spacing: 0.15em; font-size: 11px; text-transform: uppercase; font-weight: 700; color: #f59e0b; margin-bottom: 8px; text-shadow: 0 0 10px rgba(245,158,11,0.4); font-family: monospace;">
            NAMI PHARM SYSTEM
          </div>
          
          <div style="font-weight: 800; font-size: 13px; color: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
            Trwa ładowanie dekodera...
          </div>
          
          <div style="font-size: 11px; color: #888888; letter-spacing: 0.05em; font-weight: 400; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
            Optymalizacja profilu neuro-synaptycznego
          </div>
        </div>
      </div>

      <style>
        @keyframes spinClockwise {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes spinCounterClockwise {
          0% { transform: rotate(360deg); }
          100% { transform: rotate(0deg); }
        }
        @keyframes pulseLogo {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.02); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
